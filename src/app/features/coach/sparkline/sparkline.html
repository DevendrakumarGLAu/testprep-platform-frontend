@if (values().length > 0) {
  <svg [attr.width]="width()" [attr.height]="height()" [attr.viewBox]="'0 0 ' + width() + ' ' + height()" role="img" [attr.aria-label]="label()">
    @if (values().length > 1) { <polyline [attr.points]="points()" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /> }
    @if (last(); as p) { <circle [attr.cx]="p.x" [attr.cy]="p.y" r="3" fill="currentColor" /> }
  </svg>
} @else {
  <span class="none">No data</span>
}
