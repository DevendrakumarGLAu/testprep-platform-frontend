<label for="sp-search" class="form-label visually-hidden">Search students</label>
<div class="input-group">
  <input id="sp-search" type="search" class="form-control" [formControl]="search" placeholder="Search students: name, username or email" />
  <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
</div>
<p class="muted">{{ selected().length }} selected</p>
<div class="list">
  @for (s of results(); track s.id) {
    <div class="form-check">
      <input [id]="'sp-' + s.id" class="form-check-input" type="checkbox" [checked]="selected().includes(s.id)" (change)="toggle(s.id, $any($event.target).checked)" />
      <label [for]="'sp-' + s.id" class="form-check-label">
        {{ (s.first_name + ' ' + s.last_name).trim() || s.username }}
        <span class="muted">{{ s.email }}</span>
      </label>
    </div>
  } @empty {
    <div class="empty">No students found.</div>
  }
</div>
