<app-auth-layout heading="Forgot your password?" sub="Enter your email address and we will send you a link to choose a new one.">
  @if (!platform.info().email_enabled && platform.loaded()) {
    <div class="alert alert-danger" role="alert">Emails are not set up on this site. Ask your administrator to reset your password for you.</div>
  }

  @if (sent()) {
    <div class="alert alert-success" role="status">{{ sent() }}</div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="send()" novalidate>
      <div class="mb-3">
        <label for="forgot-email" class="form-label">Email</label>
        <input id="forgot-email" type="email" class="form-control" [class.is-invalid]="emailInvalid" formControlName="email" autocomplete="email" />
        @if (emailInvalid) { <div class="invalid-feedback">Enter a valid email address</div> }
      </div>

      <app-captcha />

      @if (error()) { <div class="alert alert-danger py-2" role="alert">{{ error() }}</div> }

      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm" role="status" aria-label="Sending"></span>
        } @else {
          Send the link
        }
      </button>
    </form>
  }

  <p class="switch"><a routerLink="/login">Back to sign in</a></p>
</app-auth-layout>
