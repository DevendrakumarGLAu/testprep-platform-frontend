<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Roboto, Arial, sans-serif; background: #f6f8fc; color: #1b1b1f; text-align: center; padding: 24px; }
      .card { max-width: 420px; }
      img { width: 72px; height: 72px; }
      button { margin-top: 16px; padding: 12px 24px; border: 0; border-radius: 24px; background: #0b57d0; color: #fff; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/favicon.svg" alt="" />
      <h1>You are offline</h1>
      <p>We cannot reach the server. Check your internet connection, then try again. If you were in the middle of a test, your answers are saved and the timer keeps running on the server.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
